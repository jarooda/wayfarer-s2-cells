name: Wayfarer watch

# Checks the public Wayfarer frontend for changes that could break map detection.
# - "changed"  -> quiet: written to the run summary only
# - "broken"   -> opens an issue labelled wayfarer-watch (or comments on an
#                 existing open one / a recent false-alarm with the same cause)
on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: wayfarer-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run check
        id: check
        run: node watch/check.mjs

      - name: Write run summary
        if: always()
        run: cat watch/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit updated state
        if: steps.check.outputs.status == 'baseline' || steps.check.outputs.status == 'changed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch/state.json
          git diff --cached --quiet || git commit -m "chore(watch): update Wayfarer bundle state"
          git push

      - name: Alert
        if: steps.check.outputs.status == 'broken'
        uses: actions/github-script@v7
        env:
          CAUSE: ${{ steps.check.outputs.cause }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const cause = process.env.CAUSE;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = fs.readFileSync('watch/report.md', 'utf8') + `\n[Workflow run](${runUrl})\n`;
            const title = `⚠️ Wayfarer watch: ${cause}`;

            for (const [name, color, description] of [
              ['wayfarer-watch', 'd93f0b', 'Opened by the Wayfarer watch workflow'],
              ['false-alarm', 'cccccc', 'Watcher alert that turned out fine'],
            ]) {
              try { await github.rest.issues.createLabel({ owner, repo, name, color, description }); } catch (_) {}
            }

            // 1. Any open watcher issue -> comment there instead of a new issue.
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: 'wayfarer-watch', state: 'open', per_page: 1 });
            if (open.data.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body: `Still failing (\`${cause}\`):\n\n${body}` });
              return;
            }

            // 2. Same cause marked false-alarm in the last 30 days -> comment, keep closed.
            const since = Date.now() - 30 * 24 * 3600 * 1000;
            const closed = await github.rest.issues.listForRepo({ owner, repo, labels: 'wayfarer-watch,false-alarm', state: 'closed', per_page: 50 });
            const repeat = closed.data.find(i => i.title === title && new Date(i.closed_at).getTime() > since);
            if (repeat) {
              const n = (repeat.comments || 0) + 2;
              await github.rest.issues.createComment({ owner, repo, issue_number: repeat.number, body: `Happened again (occurrence #${n}). If this keeps recurring, tune the signal in \`watch/check.mjs\`.\n\n${body}` });
              return;
            }

            // 3. Otherwise open a fresh issue.
            await github.rest.issues.create({
              owner, repo, title, labels: ['wayfarer-watch'],
              body: `${body}\n---\nVerify on /mapview with the extension (\`window.__s2MapFound === true\`). If it works, close as *not planned* and add the \`false-alarm\` label.`,
            });
