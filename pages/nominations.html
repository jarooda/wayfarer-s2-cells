<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Future Nominations</title>
  <!-- JLDS design system — https://jlds.jaluwibowo.id/guide/vanilla-html.html -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jarooda/jlds@main/registry/css/all.css">
  <style>
    body {
      min-height: 100vh;
      padding: var(--space-5) var(--space-4) var(--space-12);
    }

    .wrap { max-width: 760px; margin: 0 auto; }

    .page-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-1);
    }
    .page-header h1 {
      font-size: var(--text-xl);
      font-weight: var(--weight-bold);
      color: var(--text-primary);
      letter-spacing: var(--tracking-tight);
      margin: 0;
    }
    .count { font-size: var(--text-xs); color: var(--text-tertiary); }

    .subtitle { font-size: var(--text-xs); color: var(--text-tertiary); margin-bottom: var(--space-5); }

    .empty {
      text-align: center;
      padding: var(--space-16) 0;
      color: var(--text-tertiary);
      font-size: var(--text-base);
      line-height: var(--leading-relaxed);
    }
    .empty .icon { font-size: 40px; display: block; margin-bottom: var(--space-3); }

    .nom {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: var(--space-4);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      box-shadow: var(--elevation-card);
      padding: var(--space-4) var(--space-5);
      margin-bottom: var(--space-3);
    }

    .nom-pin {
      font-size: 22px;
      line-height: 1.4;
      flex-shrink: 0;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      cursor: pointer;
      padding: 0 4px;
    }
    .nom-pin:hover { background: var(--surface-hover); border-color: var(--border-default); }

    /* Emoji picker (markup from shared scripts/emoji.js) */
    .s2-emoji-picker { width: 250px; }
    .emoji-popover {
      position: absolute;
      top: 48px;
      left: 16px;
      z-index: 30;
      background: var(--surface-overlay);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: var(--space-2) var(--space-3);
      box-shadow: var(--elevation-popover);
      max-height: 220px;
      overflow-y: auto;
    }
    .s2-emoji-label {
      font-size: var(--text-2xs);
      font-weight: var(--weight-bold);
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin: var(--space-2) 0 4px;
    }
    .s2-emoji-label:first-child { margin-top: 0; }
    .s2-emoji-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .s2-emoji-btn {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
      background: var(--surface-muted);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      padding: 0;
    }
    .s2-emoji-btn:hover { background: var(--surface-hover); }
    .s2-emoji-btn.selected { border-color: var(--accent); background: var(--accent-subtle); }

    .nom-main { flex: 1; min-width: 0; }

    .nom-title {
      width: 100%;
      height: 50px;
      min-height: 36px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-weight: var(--weight-semibold);
      font-size: var(--text-md);
      line-height: var(--leading-snug);
      padding: 6px 8px;
      margin: -6px -8px 2px;
      resize: vertical;
      overflow: auto;
    }
    .nom-title:hover { border-color: var(--border-default); }
    .nom-title:focus { outline: none; border-color: var(--border-focus); box-shadow: var(--ring-focus); background: var(--surface-sunken); }

    .nom-meta {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin-top: var(--space-2);
      font-size: var(--text-xs);
    }

    .coord-link {
      color: var(--info);
      text-decoration: none;
      font-variant-numeric: tabular-nums;
      border-bottom: 1px dotted color-mix(in srgb, var(--info) 50%, transparent);
    }
    .coord-link:hover { color: var(--info-hover); }

    .nom-date { color: var(--text-tertiary); }
    .saved-flash { color: var(--success); font-size: var(--text-2xs); opacity: 0; transition: opacity var(--duration-base) var(--ease-standard); }
    .saved-flash.show { opacity: 1; }

    .nom-actions { display: flex; flex-direction: column; gap: var(--space-2); flex-shrink: 0; }
    .nom-actions .icon-btn { white-space: nowrap; text-align: left; }

    .icon-btn {
      background: var(--surface-card);
      border: 1px solid var(--border-default);
      color: var(--text-secondary);
      border-radius: var(--radius-md);
      padding: var(--space-2) var(--space-3);
      font-size: var(--text-sm);
      cursor: pointer;
      transition: var(--transition-control);
    }
    .icon-btn:hover { background: var(--surface-hover); border-color: var(--border-strong); color: var(--text-primary); }
    .icon-btn.del:hover { background: var(--danger-subtle); border-color: var(--danger); color: var(--danger-text); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="page-header">
      <h1>⬡ Future Nominations</h1>
      <span class="count" id="count"></span>
    </div>
    <div class="subtitle">Saved locally in this browser. Edit a title inline; click coordinates to open Google Maps.</div>
    <div id="list"></div>
  </div>
  <script src="../scripts/emoji.js"></script>
  <script src="nominations.js"></script>
</body>
</html>
